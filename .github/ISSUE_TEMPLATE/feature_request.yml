name: Feature request
description: An idea for a new parser, theme, export or option
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like vibereel to do?
      description: A sentence or two on the problem, not just the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
      description: Rough idea is fine. Mockups or links to similar tools help.
  - type: checkboxes
    id: pr
    attributes:
      label: Want to build it?
      options:
        - label: I'd like to open a PR for this
